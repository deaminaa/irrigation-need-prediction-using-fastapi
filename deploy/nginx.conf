# nginx site config for a VPS where the container gets a single port.
#
# Drop in /etc/nginx/conf.d/irrigation.conf, set server_name, reload.
# Only the Streamlit UI is proxied. FastAPI is bound to 127.0.0.1 inside the
# container and is not reachable from here by design.

# Streamlit runs its entire UI over a WebSocket. The upgrade token has to be
# mapped per request, because sending a literal "Upgrade" on ordinary HTTP
# requests breaks them.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream irrigation_ui {
    server 127.0.0.1:8501;
}

server {
    listen 80;
    server_name irrigation.example.com;

    location / {
        proxy_pass http://irrigation_ui;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streamlit's XSRF check validates against the host it believes it is
        # serving, so the original Host must survive the hop. Preserving it here
        # is what makes disabling XSRF protection unnecessary.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The UI socket is long lived and mostly idle. nginx's 60s default closes
        # it mid-session and the browser is left with a stalled app.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }
}
